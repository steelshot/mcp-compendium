name: PR title

# Pull request titles become the squash commit message, which release-please reads, so they must follow the
# Conventional Commits rules in CONTRIBUTING.md.

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened, labeled, unlabeled ]

# Deny by default; each job grants only what it needs.
permissions: { }

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read # read the pull request title
    steps:
      - name: Require a Conventional Commit title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          # Lower-case start, no trailing full stop, at most 64 characters.
          subjectPattern: ^(?![A-Z])(?!.*\.$).{1,64}$
          # Renovate titles can exceed the length limit.
          ignoreLabels: dependencies
          subjectPatternError: >-
            The description "{subject}" in "{title}" must start with a lower-case letter, must not end with a full stop,
            and must be at most 64 characters; see CONTRIBUTING.md.
