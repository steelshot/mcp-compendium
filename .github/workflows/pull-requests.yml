name: Pull Requests

# Checks run only for the areas a pull request changes: code, images and the Helm chart. Workflows and licence
# information are always checked, and changes to this workflow or .goreleaser.yaml run everything.
#
# "All checks" is the required status check; it passes when every job succeeded or was skipped.

on:
  pull_request:

# Deny by default; each job grants only what it needs.
permissions: { }

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0
  # renovate: datasource=github-releases depName=zizmorcore/zizmor extractVersion=^v(?<version>.+)$
  ZIZMOR_VERSION: 1.32.0
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.20.0
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  # renovate: datasource=github-releases depName=helm/chart-testing extractVersion=^v(?<version>.+)$
  CHART_TESTING_VERSION: 3.15.0
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  GATEWAY_API_VERSION: v1.7.0
  CI_VERSION: 0.0.0-ci

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # list the pull request's files
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' || steps.filter.outputs.pipeline == 'true' }}
      images: ${{ steps.filter.outputs.images == 'true' || steps.filter.outputs.pipeline == 'true' }}
      helm: ${{ steps.filter.outputs.helm == 'true' || steps.filter.outputs.pipeline == 'true' }}
    steps:
      - name: Classify the changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - "**/*.go"
              - go.mod
              - go.sum
              - .golangci.yaml
              - openapi.yaml
              - "schema/**"
            images:
              - "images/**"
            helm:
              - "helm/**"
              - "schema/**"
              - "internal/config/**"
            pipeline:
              - .github/workflows/pull-requests.yml
              - .goreleaser.yaml

  workflows:
    name: Workflows and licensing
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
          online-audits: false
      - name: Check every file's licence information (REUSE)
        uses: docker://fsfe/reuse:6.3.0@sha256:2748d04c2adeb747c9a44831bc99a9cbfd7bf7ff6fc371a4b63204944e3e47b6
        with:
          args: lint --lines

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Test (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-26.04 }
          - { platform: linux-arm64, runner: ubuntu-26.04-arm }
          - { platform: windows-x86_64, runner: windows-2025 }
          - { platform: macos-arm64, runner: macos-26 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...

  generated:
    name: Generated code and modules
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Check the admin API matches openapi.yaml
        run: |
          go generate ./...
          git diff --exit-code

  vulnerabilities:
    name: Vulnerabilities
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  binaries:
    name: Binaries
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.images == 'true' || needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        # zizmor: ignore[cache-poisoning] the snapshot is never published
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.xz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 3

  images:
    name: Image (${{ matrix.flavour }})
    needs: [ changes, binaries ]
    if: needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        flavour: [ distroless, minimal ]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the snapshot release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: releases/v${{ env.CI_VERSION }}
      - name: Enable arm64 emulation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-binfmt
      - name: Build both architectures from a stand-in release host
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory releases > /dev/null 2>&1 &
          podman build --format oci --network host --platform linux/amd64,linux/arm64 \
            --manifest "localhost/mcp-compendium/${FLAVOUR}:ci" -f "images/${FLAVOUR}.Containerfile" \
            --build-arg "VERSION=${CI_VERSION}" --build-arg RELEASES=http://127.0.0.1:8000 images
      - name: Smoke test
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          set -euo pipefail
          image="localhost/mcp-compendium/${FLAVOUR}:ci"
          podman run --rm --platform linux/amd64 "$image" version
          podman run --rm --platform linux/arm64 "$image" version
          mkdir -p "$RUNNER_TEMP/config"
          printf 'servers: {}\nauth:\n  allowAnonymous: true\n' > "$RUNNER_TEMP/config/config.yaml"
          podman run -d --name smoke --platform linux/amd64 --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$RUNNER_TEMP/config:/etc/mcp-compendium:ro" -p 127.0.0.1:8080:8080 "$image"
          for _ in $(seq 1 30); do podman exec smoke /usr/local/bin/mcpcd healthcheck && break; sleep 1; done
          podman exec smoke /usr/local/bin/mcpcd healthcheck
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          podman logs smoke

  chart:
    name: Helm chart
    needs: [ changes, binaries ]
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: ${{ env.CHART_TESTING_VERSION }}
      - name: Lint with every value set in helm/ci
        # yamllint's defaults reject the spacing used in empty YAML collections; the other checks cover the chart.
        run: >-
          ct lint --charts helm --validate-maintainers=false --check-version-increment=false --validate-yaml=false
          --helm-lint-extra-args=--strict
      - name: Let helm-unittest write its snapshot directory
        # The image runs as a different user from the runner and always creates tests/__snapshot__.
        run: install -d -m 0777 helm/tests/__snapshot__
      - name: Unit tests
        # The tag is the Helm version and the helm-unittest version.
        uses: docker://helmunittest/helm-unittest:4.3.0-1.2.1@sha256:28ea86c3e0b07f501f0c2e9c08b9f41e240f4a4b571cb5106b36cf0f0607e989
        env:
          # The runner's home directory is not writable by the image's user.
          HELM_CACHE_HOME: /tmp/helm/cache
          HELM_CONFIG_HOME: /tmp/helm/config
        with:
          args: helm
      - name: Render every value set in helm/ci
        run: |
          set -euo pipefail
          mkdir rendered
          for values in helm/ci/*-values.yaml; do
            helm template ci helm --values "$values" > "rendered/$(basename "$values")"
          done
      - name: Validate the rendered manifests against the Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          # Schemas for resources outside Kubernetes itself, such as HTTPRoute.
          args: >-
            -strict -summary -output pretty -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            rendered
      - name: Download the snapshot release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: releases/v${{ env.CI_VERSION }}
      - name: Build the image under test
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory releases > /dev/null 2>&1 &
          podman build --format oci --network host --platform linux/amd64 -t localhost/mcp-compendium/distroless:ci \
            -f images/distroless.Containerfile --build-arg "VERSION=${CI_VERSION}" --build-arg RELEASES=http://127.0.0.1:8000 images
          # kind loads images by repository tag, which only the docker-archive format keeps.
          podman save --format docker-archive -o "$RUNNER_TEMP/image.tar" localhost/mcp-compendium/distroless:ci
      - name: Create a kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      - name: Install with every value set in helm/ci and run helm test
        run: |
          set -euo pipefail
          kind load image-archive "$RUNNER_TEMP/image.tar" --name chart-testing
          # The exposure value set renders an HTTPRoute, which needs the Gateway API definitions.
          kubectl apply --server-side \
            -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
          image_args="--set=image.fullRepository=localhost/mcp-compendium/distroless --set-string=image.tag=ci"
          ct install --charts helm --helm-extra-set-args "${image_args} --set=image.pullPolicy=Never --set=auth.allowAnonymous=true"

  all:
    name: All checks
    if: always()
    needs: [ changes, workflows, lint, test, generated, vulnerabilities, binaries, images, chart ]
    runs-on: ubuntu-26.04
    permissions: { }
    steps:
      - name: Require every job to have passed or been skipped for an unchanged area
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test, generated, vulnerabilities, binaries, images, chart
