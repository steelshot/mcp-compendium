name: Release

# release-please maintains a release pull request for unreleased feat and fix changes. Merging it tags and publishes
# the release; this workflow then adds the binaries, image and Helm chart, all signed and attested. A patch release
# pull request merges itself once checks pass if it fixes a vulnerability that affects the last release; otherwise it
# waits for a maintainer.

on:
  push:
    branches: [ main ]
  # Daily, for advisories published after their fix reached main, such as a Go release announced before its entries.
  schedule:
    - cron: "23 5 * * *"

# Deny by default; each job grants only what it needs.
permissions: { }

concurrency:
  group: release
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.20.2
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.2
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.10.0
  CHARTS: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-please:
    name: Release PR and release
    runs-on: ubuntu-26.04
    # GitHub App token: pull requests created with GITHUB_TOKEN do not trigger workflows, and only the App may create
    # v* tags.
    environment: release
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      pending-pr: ${{ steps.pending.outputs.pr }}
      pending-since: ${{ steps.pending.outputs.since }}
    steps:
      - name: Get a GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Find a patch release pull request whose Go code or modules changed
        id: pending
        if: ${{ !steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          # release-please's own output is empty when the pull request is unchanged, so look it up by its label.
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json number,title --jq 'first // empty')"
          if [ -z "$pr" ]; then
            echo "No release pull request is open."
            exit 0
          fi
          number="$(jq -r .number <<< "$pr")"
          next="$(jq -r .title <<< "$pr")"
          next="${next##* }"
          last="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          current="${last#v}"
          if [ -z "$last" ] || [ "${next%.*}" != "${current%.*}" ]; then
            echo "Release ${next} after ${last:-nothing} is not a patch release; it waits for a maintainer."
            exit 0
          fi
          # Only Go code, go.mod and go.sum can change what govulncheck reports.
          if ! gh api "repos/${GITHUB_REPOSITORY}/compare/${last}...${GITHUB_SHA}" --paginate --jq '.files[].filename' |
            grep -qE '^go\.(mod|sum)$|\.go$'; then
            echo "Release ${next} changes no Go code or modules since ${last}; it waits for a maintainer."
            exit 0
          fi
          echo "Release ${next} changes Go code or modules since ${last}; checking for fixed vulnerabilities."
          echo "pr=${number}" >> "$GITHUB_OUTPUT"
          echo "since=${last}" >> "$GITHUB_OUTPUT"

  vulnerabilities:
    name: Vulnerabilities fixed since the last release
    needs: release-please
    if: needs.release-please.outputs.pending-pr
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      fixed: ${{ steps.compare.outputs.fixed }}
    steps:
      - name: Check out the last release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pending-since }}
          path: previous
          persist-credentials: false
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current
          persist-credentials: false
      # govulncheck reports standard library vulnerabilities for the Go that runs it, so each tree is scanned with the
      # Go its go.mod requires. Only vulnerabilities in code the program calls count.
      - name: Set up the last release's Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: previous/go.mod
          cache: false
      - name: Scan the last release
        working-directory: previous
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -format json ./... > "$RUNNER_TEMP/previous.json"
      - name: Set up main's Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: current/go.mod
          cache: false
      - name: Scan main
        working-directory: current
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -format json ./... > "$RUNNER_TEMP/current.json"
      - name: List the vulnerabilities main fixes
        id: compare
        run: |
          set -euo pipefail
          called() {
            jq -rs '[.[] | select(.finding != null and .finding.trace[0].function != null) | .finding.osv] | unique[]' "$1"
          }
          fixed="$(comm -23 <(called "$RUNNER_TEMP/previous.json") <(called "$RUNNER_TEMP/current.json") | paste -sd ' ' -)"
          echo "Called vulnerabilities in the last release: $(called "$RUNNER_TEMP/previous.json" | paste -sd ' ' -)"
          echo "Fixed on main: ${fixed:-none}"
          echo "fixed=${fixed}" >> "$GITHUB_OUTPUT"

  merge-security-release:
    name: Merge the release pull request for security fixes
    needs: [ release-please, vulnerabilities ]
    if: needs.vulnerabilities.outputs.fixed
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Get a GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Merge once checks pass
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ needs.release-please.outputs.pending-pr }}
          FIXED: ${{ needs.vulnerabilities.outputs.fixed }}
        run: |
          echo "The release fixes ${FIXED}; merging #${PR} once checks pass."
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash

  binaries:
    name: Binaries
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write # upload release assets
      id-token: write # OIDC token for Sigstore signing and attestations
      attestations: write # store attestations
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Published builds never use a cache.
          cache: false
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build, sign and upload with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip
      - name: Add the provenance bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/mcp-compendium-${VERSION}.intoto.jsonl"
          gh release upload "$TAG" "$RUNNER_TEMP/mcp-compendium-${VERSION}.intoto.jsonl" --repo "$GITHUB_REPOSITORY"

  image:
    name: Image
    needs: [ release-please, binaries ]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # OIDC token for Sigstore signing and attestations
      attestations: write # store attestations
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAGS: >-
        ${{ needs.release-please.outputs.version }}
        ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        ${{ needs.release-please.outputs.major }}
        latest
      REPOSITORY: ghcr.io/${{ github.repository }}/distroless
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Enable arm64 emulation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-binfmt
      - name: Build from the published release
        run: |
          podman build --format oci --pull=always --platform linux/amd64,linux/arm64 \
            --manifest "$REPOSITORY:build" --build-arg "VERSION=${VERSION}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.licenses=AGPL-3.0-only" .
      - name: Smoke test
        run: |
          podman run --rm --platform linux/amd64 "$REPOSITORY:build" version
          podman run --rm --platform linux/arm64 "$REPOSITORY:build" version
      - name: Push
        id: push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in $TAGS; do
            podman manifest push --all --format oci --digestfile "$RUNNER_TEMP/digest" "$REPOSITORY:build" "docker://$REPOSITORY:$tag"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          cosign sign --yes "$REPOSITORY@$DIGEST"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REPOSITORY }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

  chart:
    name: Helm chart
    # After the image, so the chart's image tag always exists.
    needs: [ release-please, image ]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # push the chart to GHCR
      id-token: write # OIDC token for Sigstore signing and attestations
      attestations: write # store attestations
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Package and push
        id: push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helm package helm --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/mcp-compendium-${VERSION}.tgz" "oci://${CHARTS}" 2>&1 | tee "$RUNNER_TEMP/push.log"
          echo "digest=$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")" >> "$GITHUB_OUTPUT"
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          cosign sign --yes "${CHARTS}/mcp-compendium@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHARTS }}/mcp-compendium
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
