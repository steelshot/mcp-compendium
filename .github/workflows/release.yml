name: Release

# release-please maintains a release pull request for unreleased feat and fix changes. Merging it tags and publishes
# the release; this workflow then adds the binaries, images and Helm chart, all signed and attested. Patch-only
# release pull requests merge themselves once checks pass.

on:
  push:
    branches: [ main ]

# Deny by default; each job grants only what it needs.
permissions: { }

concurrency:
  group: release
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.20.1
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  CHARTS: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-please:
    name: Release PR and release
    runs-on: ubuntu-26.04
    # GitHub App token: pull requests created with GITHUB_TOKEN do not trigger workflows, and only the App may create
    # v* tags.
    environment: release
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - name: Get a GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Auto-merge patch release PRs
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          number="$(jq -r .number <<< "$PR")"
          next="$(jq -r .title <<< "$PR")"
          next="${next##* }"
          last="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          last="${last#v}"
          if [ -n "$last" ] && [ "${next%.*}" = "${last%.*}" ]; then
            echo "Release ${next} only bumps the patch version of ${last}; merging once checks pass."
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash
          else
            echo "Release ${next} after ${last:-nothing} waits for a maintainer to merge it."
          fi

  binaries:
    name: Binaries
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write # upload release assets
      id-token: write # OIDC token for Sigstore signing and attestations
      attestations: write # store attestations
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Published builds never use a cache.
          cache: false
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build, sign and upload with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip
      - name: Add the provenance bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/mcp-compendium-${VERSION}.intoto.jsonl"
          gh release upload "$TAG" "$RUNNER_TEMP/mcp-compendium-${VERSION}.intoto.jsonl" --repo "$GITHUB_REPOSITORY"

  images:
    name: Image (${{ matrix.flavour }})
    needs: [ release-please, binaries ]
    strategy:
      fail-fast: false
      matrix:
        flavour: [ distroless, minimal ]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # OIDC token for Sigstore signing and attestations
      attestations: write # store attestations
    env:
      FLAVOUR: ${{ matrix.flavour }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAGS: >-
        ${{ needs.release-please.outputs.version }}
        ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        ${{ needs.release-please.outputs.major }}
        latest
      REPOSITORY: ghcr.io/${{ github.repository }}/${{ matrix.flavour }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Enable arm64 emulation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-binfmt
      - name: Build from the published release
        run: |
          podman build --format oci --pull=always --platform linux/amd64,linux/arm64 \
            --manifest "$REPOSITORY:build" -f "images/${FLAVOUR}.Containerfile" --build-arg "VERSION=${VERSION}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.licenses=AGPL-3.0-only" images
      - name: Smoke test
        run: |
          podman run --rm --platform linux/amd64 "$REPOSITORY:build" version
          podman run --rm --platform linux/arm64 "$REPOSITORY:build" version
      - name: Push
        id: push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in $TAGS; do
            podman manifest push --all --format oci --digestfile "$RUNNER_TEMP/digest" "$REPOSITORY:build" "docker://$REPOSITORY:$tag"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          cosign sign --yes "$REPOSITORY@$DIGEST"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REPOSITORY }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

  chart:
    name: Helm chart
    # After the images, so the chart's image tag always exists.
    needs: [ release-please, images ]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # push the chart to GHCR
      id-token: write # OIDC token for Sigstore signing and attestations
      attestations: write # store attestations
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Package and push
        id: push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helm package helm --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/mcp-compendium-${VERSION}.tgz" "oci://${CHARTS}" 2>&1 | tee "$RUNNER_TEMP/push.log"
          echo "digest=$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")" >> "$GITHUB_OUTPUT"
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$REGISTRY_TOKEN"
          cosign sign --yes "${CHARTS}/mcp-compendium@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHARTS }}/mcp-compendium
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
