name: Scorecard

# OpenSSF Scorecard: supply-chain checks published to the code scanning dashboard and the public Scorecard API.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Deny by default; each job grants only what it needs.
permissions: { }

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Analysis
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token to publish results
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
