name: Scorecard

# OpenSSF Scorecard: supply-chain checks published to the code scanning dashboard and the public Scorecard API.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Deny by default; each job grants only what it needs.
permissions: { }

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Analysis
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # OIDC token to publish results
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
