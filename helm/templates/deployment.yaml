apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-compendium.fullname" . }}
  labels:
    {{- include "mcp-compendium.labels" . | nindent 4 }}
spec:
  # Sessions and the OAuth token store are local to one process, so the daemon runs as a single replica and a rollout
  # stops the old pod before starting the new one, which also releases the ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mcp-compendium.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingConfigMap }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-compendium.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mcp-compendium.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp-compendium
          image: {{ include "mcp-compendium.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [ "serve" ]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: MCP_COMPENDIUM_LISTEN
              value: ":8080"
            - name: MCP_COMPENDIUM_CONFIG
              value: /etc/mcp-compendium
            - name: MCP_COMPENDIUM_STATE_DIR
              value: /var/lib/mcp-compendium
            - name: MCP_COMPENDIUM_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: MCP_COMPENDIUM_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            {{- with .Values.publicUrl }}
            - name: MCP_COMPENDIUM_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-compendium
              readOnly: true
            - name: state
              mountPath: /var/lib/mcp-compendium
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mcp-compendium.configMapName" . }}
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mcp-compendium.claimName" . }}
          {{- else }}
          emptyDir: { }
          {{- end }}
        - name: tmp
          emptyDir: { }
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
